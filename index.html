  --ok:#2f7a4e; --ok-soft:#e7f3ec; --warn:#a2680f; --warn-soft:#fbf2e1; --bad:#ae4136; --bad-soft:#fbeae8;
  --sh:0 1px 2px rgba(16,24,40,.04),0 3px 10px -6px rgba(16,24,40,.14);
  --r:14px;
  --ui:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
  --disp:'Cairo','Tajawal','Segoe UI',sans-serif;
  --serif:'Amiri','Traditional Arabic','Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-skin="light"]){
    color-scheme:dark;
    --acc:color-mix(in srgb,var(--acc-base) 60%,#fff);
    --acc-ink:color-mix(in srgb,var(--acc-base) 45%,#fff);
    --acc-soft:color-mix(in srgb,var(--acc-base) 22%,#12171d);
    --acc-line:color-mix(in srgb,var(--acc-base) 40%,#12171d);
    --bg:#0f1318; --bg2:#1a2027; --card:#161b21; --ink:#e7ebef; --muted:#97a1ab; --line:#262d35;
    --gold:#d2b06c; --gold-soft:#29231a;
    --ok:#6cc08d; --ok-soft:#17271e; --warn:#ddb062; --warn-soft:#2b2416; --bad:#e78b7f; --bad-soft:#2f1c1a;
    --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]:not([data-skin="light"]),:root[data-skin="dark"]{
  color-scheme:dark;
  --acc:color-mix(in srgb,var(--acc-base) 60%,#fff);
  --acc-ink:color-mix(in srgb,var(--acc-base) 45%,#fff);
  --acc-soft:color-mix(in srgb,var(--acc-base) 22%,#12171d);
  --acc-line:color-mix(in srgb,var(--acc-base) 40%,#12171d);
  --bg:#0f1318; --bg2:#1a2027; --card:#161b21; --ink:#e7ebef; --muted:#97a1ab; --line:#262d35;
  --gold:#d2b06c; --gold-soft:#29231a;
  --ok:#6cc08d; --ok-soft:#17271e; --warn:#ddb062; --warn-soft:#2b2416; --bad:#e78b7f; --bad-soft:#2f1c1a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px -8px rgba(0,0,0,.6);
}
:root[data-skin="light"]{color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.6;direction:rtl;
  -webkit-text-size-adjust:100%;overflow-wrap:anywhere;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12.5px}

/* ---------- header & nav ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:1000px;margin:0 auto;padding-inline:14px;height:54px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;flex:none}
.lmask{display:block;background:var(--acc);-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.brand .lmask,.brand img{height:34px;width:52px;object-fit:contain}
.brand small{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink)}
.topnav{display:none;gap:2px;margin-inline-start:10px}
.topnav button{padding:7px 11px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.topnav button.on{color:var(--acc-ink);background:var(--acc-soft)}
.hend{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.sync{display:none}
.sync.ok{background:var(--ok)} .sync.busy{background:var(--warn)}
.hbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.hbtn:hover{background:var(--bg2);color:var(--ink)}
.who{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer;max-width:46vw}
.who .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-ink);font-weight:800;font-size:12.5px;flex:none}
.who span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{font-style:normal;color:var(--muted)} .who b{font-family:var(--disp)}
@media(min-width:880px){.topnav{display:flex}.tabbar{display:none!important}body{padding-bottom:32px}}
@media(max-width:420px){.who em{display:none}}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:45;display:flex;align-items:flex-end;justify-content:space-around;background:var(--card);
  border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 0 3px}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--acc)}
.tabbar .fab{flex:none;width:50px;height:50px;border-radius:50%;margin:-18px 4px 2px;background:var(--acc);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--acc) 70%,transparent),0 0 0 4px var(--card)}
.tabbar .fab svg{width:24px;height:24px;stroke-width:2.2}
main{max-width:1000px;margin:0 auto;padding-inline:14px;padding-block:12px 28px}
.view-in{animation:vIn .16s ease-out}
@keyframes vIn{from{opacity:.4}to{opacity:1}}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.blk-h h3{margin:0;font-size:14.5px;font-weight:800;display:flex;gap:7px;align-items:center}
.blk-h h3 svg{color:var(--acc);width:17px;height:17px}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:760px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.sec-h h2{margin:0;font-size:15.5px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:11px;font-weight:700;font-size:13.5px;background:var(--acc);color:#fff;white-space:nowrap;transition:filter .12s,transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--acc-soft);color:var(--acc-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.6}
.link{color:var(--acc);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:15px;height:15px}
.xbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.xbtn:hover{background:var(--bad-soft);color:var(--bad)}
.xbtn svg{width:15px;height:15px}
.ibtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none;border:1px solid var(--line);background:var(--card)}
.ibtn svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:var(--acc-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill svg{width:12px;height:12px}
.empty{text-align:center;color:var(--muted);padding:18px 12px;font-size:13.5px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty .btn{margin-top:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.flabel,.field>label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px}
.flabel svg,.field>label svg{width:14px;height:14px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 11px;outline:none;line-height:1.6;transition:border-color .12s}
.in:focus{border-color:var(--acc);background:var(--card)}
textarea.in{resize:vertical;min-height:60px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:13px 55%,18px 55%;background-size:5px 5px;background-repeat:no-repeat;padding-left:30px}
input[type=date].in,input[type=time].in{min-height:40px}
.addrow{display:flex;gap:6px;align-items:center}
.addrow .in{flex:1;min-width:0}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--acc-ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.s-ok{color:var(--ok)} .seg button.on.s-warn{color:var(--warn)} .seg button.on.s-bad{color:var(--bad)}
.dots{display:inline-flex;gap:4px}
.dots button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:800;color:var(--muted)}
.dots button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip svg{width:13px;height:13px}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}
.cb{width:22px;height:22px;border-radius:7px;border:1.6px solid color-mix(in srgb,var(--muted) 55%,transparent);display:grid;place-items:center;flex:none;background:var(--card)}
.cb svg{width:13px;height:13px;stroke-width:2.6;opacity:0}
.cb.on{background:var(--acc);border-color:var(--acc);color:#fff} .cb.on svg{opacity:1}
.tip{display:flex;gap:8px;padding:9px 11px;border-radius:11px;background:var(--acc-soft);font-size:13.5px;line-height:1.8}
.tip svg{color:var(--acc);margin-top:3px}
.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:880px){.toast{bottom:24px}}

/* quotes */
.ayah,.hadith{margin:0;font-family:var(--serif);font-size:17px;line-height:1.95}
.ayah cite,.hadith cite{display:block;font-family:var(--ui);font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.5}
.ayah .orn{color:var(--gold)}
.ev{display:flex;flex-direction:column;gap:8px;padding:11px 13px;border-radius:12px;background:var(--gold-soft)}
.hukm{font-size:13px;font-weight:800;color:var(--gold)}

/* ---------- picker & sheet ---------- */
.pk{display:flex;flex-direction:column;gap:6px}
.pk-h{display:flex;align-items:center;gap:6px}
.pk-h .flabel{flex:1}
.pk-add{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--acc);padding:3px 9px;border-radius:99px;background:var(--acc-soft)}
.pk-add svg{width:13px;height:13px}
.tipb{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:var(--gold-soft)}
.tipb svg{width:14px;height:14px}
.pk-sel{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;align-items:center}
.mchip{display:inline-flex;align-items:center;gap:2px;padding:2px 4px 2px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc-ink);font-size:12.5px;font-weight:700}
.mchip .mx{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--acc-ink);opacity:.7}
.mchip .mx svg{width:11px;height:11px;stroke-width:2.4}
.mchip.plain{padding:2px 10px}
.sheet{position:fixed;inset:0;z-index:70}
.sh-bg{position:absolute;inset:0;background:rgba(10,14,20,.42);animation:fadeIn .15s}
.sh-panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;background:var(--card);border-radius:18px 18px 0 0;
  box-shadow:0 -10px 30px -10px rgba(0,0,0,.3);animation:upIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:700px){.sh-panel{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);max-height:80vh;border-radius:18px;transform:translate(-50%,-50%);animation:fadeIn .15s}}
@keyframes upIn{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.sh-head b{flex:1;font-size:15px}
.sh-body{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.sh-foot{padding:8px 14px 12px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.srows{display:flex;flex-direction:column}
.sgrp{font-size:12px;font-weight:800;color:var(--muted);padding:10px 4px 4px}
.srw{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.srow{flex:1;display:flex;align-items:center;gap:10px;padding:9px 4px;text-align:start;min-width:0}
.srow .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}

.srow .tx{flex:1;min-width:0} .srow b{font-weight:600;font-size:14px} .srow small{display:block;color:var(--muted);font-size:12px;line-height:1.5}

/* ---------- rows & lists ---------- */
.rows{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;width:100%}
.row:last-child{border-bottom:0}

.row .rt small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>svg.i{color:var(--muted);width:16px;height:16px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-ink);font-weight:800;font-size:15px;flex:none;overflow:hidden}

.av.sq{border-radius:11px}
.av svg{width:18px;height:18px}
.pct{font-size:12.5px;font-weight:800;color:var(--acc-ink)}
.mnear{display:flex;gap:2px}
.mnear i{width:6px;height:6px;border-radius:2px;background:var(--line)}
.mnear i.on{background:var(--acc)}
.dot-warn{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.bar{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden}

/* ---------- home ---------- */
.band{position:relative;overflow:hidden;border-radius:18px;padding:16px 16px 44px;color:#fff;
  background:linear-gradient(135deg,var(--acc-base),color-mix(in srgb,var(--acc-base) 62%,#000))}

.qcard{position:relative;margin:-32px 10px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:10px 6px;background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--line)}

.mini2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:start;min-width:0}

.mini b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini>div{min-width:0}
.zad{padding:12px 14px}
.zad .zl{font-size:11.5px;font-weight:800;color:var(--gold);margin-bottom:4px}
.zad-f{display:flex;gap:14px;justify-content:flex-end;margin-top:6px}
.homegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media(min-width:880px){.homegrid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}

/* ---------- page heads ---------- */
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.phead h1{margin:0;font-family:var(--disp);font-size:20px;font-weight:800;flex:1}

.stat small{font-size:11.5px;color:var(--muted)}
.search{position:relative;flex:1;min-width:150px}
.search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search .in{padding-right:32px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 12px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:5px;align-items:center}
.tabs button.on{color:var(--acc-ink);border-color:var(--acc)}
.tabs svg{width:15px;height:15px}

/* ---------- person ---------- */
.phero{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;flex-wrap:wrap}
.ph-av{position:relative;width:62px;height:62px;flex:none}
.ph-av .av{width:62px;height:62px;font-size:24px}
.ph-cam{position:absolute;bottom:-2px;left:-2px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--acc)}
.ph-cam svg{width:13px;height:13px}
.ph-info{flex:1;min-width:160px;display:flex;flex-direction:column;gap:3px}
.ph-act{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.near{display:flex;gap:3px;align-items:center}
.near i{width:20px;height:6px;border-radius:99px;background:var(--bg2)}
.near i.on{background:var(--acc)}
.near span{font-size:12px;color:var(--muted);margin-inline-start:6px}
.nearpick{display:flex;gap:3px}
.nearpick button{flex:1;padding:6px 2px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;color:var(--muted)}
.nearpick button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.pts{display:flex;flex-direction:column;gap:2px}
.ptg{font-size:12px;font-weight:800;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.ptg svg{width:14px;height:14px;color:var(--acc)}
.pt{display:flex;align-items:center;gap:6px}
.pt:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;margin-inline-start:4px}
.pt-in{flex:1;border:0;background:transparent;padding:4px 2px;outline:none;min-width:0;border-bottom:1px dashed transparent}
.pt-in:focus{border-bottom-color:var(--line)}
.goal{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:var(--bg2)}
.gst{flex:none;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line)}
.gst.s1{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.gst.s2{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.goal .tx{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.srow2{display:flex;gap:8px;align-items:center;padding:4px 0}
.srow2 .in{padding:5px 8px}
.srow2.done .in:first-of-type{text-decoration:line-through;color:var(--muted)}
.late{color:var(--bad)!important}
.tl{display:flex;flex-direction:column;gap:8px}
.tl .mo{font-size:12px;font-weight:800;color:var(--muted);margin-top:4px}
.je{display:flex;gap:9px;align-items:flex-start}
.je .jb{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.je .jb svg{width:16px;height:16px}
.je .jc{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.je .jh{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.je .jh b{color:var(--ink)}
.je p{margin:2px 0 0;white-space:pre-wrap;font-size:13.5px}
.lvchart{width:100%;max-width:520px;aspect-ratio:340/120;height:auto;display:block;flex:none}
.lvchart text{font-family:var(--ui)}

/* ---------- halaqa / manhaj ---------- */
.hc{display:flex;flex-direction:column;gap:6px;padding:11px 12px;text-align:start;width:100%}
.hc-t{display:flex;align-items:center;gap:9px}
.hc-t .rt{flex:1;min-width:0}
.hc-t b{display:block;font-size:14.5px}
.hc-t small{color:var(--muted);font-size:12px}
.hc-m{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.nextbox{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--acc-soft);color:var(--acc-ink)}
.nextbox b{display:block;font-size:15px} .nextbox small{display:block;font-size:12px;opacity:.85}
.insight{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--warn-soft);font-size:13px}
.insight.ok{background:var(--ok-soft)}
.insight>svg{color:var(--warn);flex:none;width:15px;height:15px} .insight.ok>svg{color:var(--ok)}
.htypes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.htype{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:700;color:var(--muted)}
.htype svg.mot{width:22px;height:22px;color:var(--acc)}
.htype.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink)}
.unit{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;background:var(--bg2)}
.unit .tx{flex:1;min-width:0;font-size:13.5px}
.unit.done .tx{text-decoration:line-through;color:var(--muted)}
.subj{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.subj-h{display:flex;align-items:center;gap:6px;padding:7px 9px;background:var(--bg2)}
.subj-h .in{background:transparent;border-color:transparent;font-weight:800;padding:4px 6px}
.subj-h .in:focus{background:var(--card);border-color:var(--line)}
.subj-b{padding:8px 9px;display:flex;flex-direction:column;gap:5px}
.urow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center}
.urow .n{font-size:11.5px;color:var(--muted);text-align:center}
.urow .in{padding:5px 8px}
.ubtns{display:flex}
.file{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;background:var(--bg2)}
.file .rt{flex:1;min-width:0} .file b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .file small{font-size:11.5px;color:var(--muted)}
.ag-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.ag-bar i{display:block;min-width:4px;background:var(--acc)}
.ag-bar i:nth-child(2n){background:color-mix(in srgb,var(--acc) 55%,var(--card))}
.ag-bar i:nth-child(3n){background:var(--gold)}
.ag-row{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:6px;align-items:center}
.minbox{position:relative}.minbox .in{padding-left:22px}.minbox small{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11.5px}
.ring{position:relative;width:58px;height:58px;flex:none}

/* ---------- plan deck ---------- */
.planview{display:flex;flex-direction:column;min-height:360px}
.secbar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.secbar::-webkit-scrollbar{display:none}
.secbar button{flex:none;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:var(--card);display:flex;gap:4px;align-items:center}
.secbar button svg{width:13px;height:13px}
.secbar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dotbar{display:flex;gap:2px;margin-bottom:8px}
.dotbar i{flex:1;height:4px;border-radius:99px;background:var(--line);cursor:pointer}
.dotbar i.f{background:var(--acc-line)} .dotbar i.s{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)} .dotbar i.c{background:var(--acc)}
.deck{flex:1;min-height:0;display:flex;max-width:680px;width:100%;margin:0 auto}
.fc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px 14px 18px;display:flex;flex-direction:column;gap:16px;position:relative}
.fc-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.fc-top .sname{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--acc-ink)}
.fc-top .sname svg{width:15px;height:15px}
.q{display:flex;flex-direction:column;gap:8px}
.qt2{font-family:var(--disp);font-size:18px;font-weight:700;line-height:1.5}
.qh{font-size:12.5px;color:var(--muted);margin-top:-5px}
.fc-item{display:flex;flex-direction:column;gap:6px;padding:9px 11px;border-radius:12px;background:var(--bg2)}
.fc-item .nm{display:flex;align-items:center;gap:7px;font-weight:800}
.fc-skipped{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 11px;border-radius:11px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:700}
.fc-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:680px;width:100%;margin:0 auto;padding-block:8px 6px;flex:none}
.fc-nav .mid{display:flex;gap:6px}
.fc-nav .btn{padding:10px 16px;font-size:14px}
.fc-nav .skip{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.fc-foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);text-align:center;font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--muted)}
.fc-foot cite{display:block;font-family:var(--ui);font-style:normal;font-size:11.5px}
.fc.a-next{animation:fcN .22s ease-out}.fc.a-prev{animation:fcP .22s ease-out}.fc.a-skip{animation:fcS .24s ease-out}
@keyframes fcN{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fcP{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fcS{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.spaces{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.space{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;color:var(--muted)}
.space svg{width:19px;height:19px}
.space.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-ink)}
.mk{width:8px;height:8px;border-radius:3px;flex:none}
.mk.m{background:var(--bad)} .mk.r{background:var(--ok)}
.irow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;background:var(--bg2)}
.irow .tx{flex:1;min-width:0} .irow b{font-size:13.5px;display:block} .irow small{font-size:12px;color:var(--muted);display:block}

/* ---------- library / settings ---------- */
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.lcard{padding:11px 13px;display:flex;flex-direction:column;gap:7px}
.lcard h3{margin:0;font-size:14.5px;display:flex;align-items:center;gap:7px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);width:58px}
.sw i{width:34px;height:34px;border-radius:50%;display:block;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{color:var(--ink)} .sw.on i{box-shadow:0 0 0 2px var(--ink)}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.fontbtn{border:1px solid var(--line);border-radius:11px;padding:6px 8px;background:var(--bg);text-align:center;display:flex;flex-direction:column}
.fontbtn b{font-size:18px;line-height:1.5}
.fontbtn small{font-size:11px;color:var(--muted)}
.fontbtn.on{border-color:var(--acc);background:var(--acc-soft)}
.logo-prev{width:96px;height:64px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:12px;background:var(--bg)}
.logo-prev .lmask,.logo-prev img{width:80px;height:52px;object-fit:contain}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;overflow:hidden;color:var(--ink);
  background:radial-gradient(90% 70% at 50% 38%,#fff 0%,#f7f4ec 60%,#efe9dc 100%);clip-path:circle(150% at 50% 42%);transition:clip-path .5s cubic-bezier(.7,0,.3,1)}
.intro.out{clip-path:circle(0% at 50% 42%);pointer-events:none}
.in-mand{position:absolute;left:50%;top:42%;width:min(560px,135vw);aspect-ratio:1;translate:-50% -50%;background:var(--acc-base);opacity:.13;
  -webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:mand 2.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes mand{from{transform:scale(.55) rotate(-50deg);opacity:0}60%{opacity:.16}to{transform:scale(1) rotate(8deg);opacity:.13}}
.in-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%;max-width:640px}
.in-dome{width:min(120px,30vw);height:auto;filter:drop-shadow(0 8px 14px rgba(160,110,20,.25));animation:rise .55s .05s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
.in-logo{display:block;width:min(210px,54vw);aspect-ratio:440/286;height:auto;margin-top:-6px;clip-path:inset(0 0 0 100%);animation:wipe .6s .3s cubic-bezier(.6,0,.2,1) forwards}
.in-logo.lmask{background:var(--acc-base)}
img.in-logo{object-fit:contain}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.in-line{width:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#c9a24a,transparent);animation:inLine .5s .75s ease-out forwards}
@keyframes inLine{to{width:150px}}
.in-ayah{margin:4px 0 0;font-family:var(--serif);font-size:min(3.9vw,24px);line-height:1.9;display:flex;flex-direction:column;align-items:center;color:var(--acc-ink)}
.in-ayah>span{white-space:nowrap;clip-path:inset(0 0 0 100%);animation:wipe .55s cubic-bezier(.5,0,.2,1) forwards}
.in-ayah .l1{animation-delay:.85s}.in-ayah .l2{animation-delay:1.15s}
.in-ayah .orn{color:#b8902f}
.intro cite{font-style:normal;font-size:12px;color:var(--muted);opacity:0;animation:fadeIn .4s 1.6s forwards}
/* ---------- profile viewer (screen + PDF) ---------- */
.viewer{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;animation:fadeIn .15s}
.vbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.vbar b{flex:1;font-size:15px}
.vwrap{max-width:820px;margin:14px auto 40px;padding-inline:12px}
.pv{--a:#2b5c8a;--ad:#1d3f60;--as:#eaf1f8;--g:#a5823a;--gs:#f7f1e3;--ink:#18212b;--mu:#66707a;--ln:#e3e6ea;
  background:#fff;color:var(--ink);font-family:var(--ui);border-radius:18px;overflow:hidden;box-shadow:var(--sh);line-height:1.75;direction:rtl}
.pv *{box-sizing:border-box}
.pv-print{width:794px;border-radius:0;box-shadow:none}
.pv-cover{position:relative;padding:26px 26px 22px;color:#fff;background:linear-gradient(135deg,var(--a),var(--ad));display:flex;gap:18px;align-items:center}
.pv-ph{width:104px;height:104px;border-radius:50%;flex:none;border:4px solid rgba(255,255,255,.85);overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:40px;font-weight:800}
.pv-ph img{width:100%;height:100%;object-fit:cover}
.pv-cover h1{margin:0;font-family:var(--disp);font-size:32px;line-height:1.3;font-weight:800}
.pv-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pv-tags span{font-size:13px;font-weight:700;padding:2px 12px;border-radius:99px;background:rgba(255,255,255,.18)}
.pv-near{display:flex;gap:4px;align-items:center;margin-top:10px;font-size:13px}
.pv-near i{width:30px;height:8px;border-radius:99px;background:rgba(255,255,255,.25)}
.pv-near i.on{background:#fff}
.pv-near span{margin-inline-start:8px;opacity:.9}
.pv-logo{position:absolute;left:18px;top:14px;width:64px;height:42px;object-fit:contain;opacity:.9}
.pv-body{padding:18px 20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv-t{border:1px solid var(--ln);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.pv-t.wide{grid-column:1/-1}
.pv-t h3{margin:0;font-size:15px;font-weight:800;color:var(--ad);display:flex;gap:7px;align-items:center}
.pv-t h3 i{width:26px;height:26px;border-radius:8px;background:var(--as);display:grid;place-items:center;font-style:normal}
.pv-chips{display:flex;flex-wrap:wrap;gap:6px}
.pv-chips span{font-size:14px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--as);color:var(--ad)}
.pv-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14.5px}
.pv-kv dt{font-weight:800;color:var(--mu);font-size:13px;padding-top:2px}
.pv-kv dd{margin:0}
.pv-ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.pv-ul li{display:flex;gap:8px;align-items:flex-start}
.pv-ul li:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--a);flex:none;margin-top:9px}
.pv-g{font-size:12.5px;font-weight:800;color:var(--mu);margin-top:2px}
.pv-goal{display:flex;gap:8px;align-items:center;font-size:14.5px}
.pv-goal b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;border:1.5px solid var(--ln);color:var(--mu)}
.pv-goal b.s1{border-color:var(--g);color:var(--g)} .pv-goal b.s2{background:var(--a);border-color:var(--a);color:#fff}
.pv-ev{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.pv-ev time{flex:none;font-size:12px;font-weight:800;color:var(--a);background:var(--as);border-radius:8px;padding:1px 8px;margin-top:2px}
.pv-dua{background:var(--gs);border-radius:14px;padding:12px 16px;font-family:var(--serif);font-size:18px;line-height:1.9;color:#6b5320;text-align:center}
.pv-desc{font-size:15px;line-height:1.9;border-inline-start:3px solid var(--a);padding-inline-start:12px}
.pv-foot{text-align:center;padding:0 20px 18px;font-family:var(--serif);font-size:16px;color:var(--mu)}
.pv-foot .o{color:var(--g)}
@media(max-width:620px){.vwrap .pv-body{grid-template-columns:1fr}.vwrap .pv-cover{flex-direction:column;text-align:center}.vwrap .pv-tags,.vwrap .pv-near{justify-content:center}}

.pd-preview .plogo{display:none}
.pd-hero .by b{white-space:nowrap}

/* inline editing */
.in.inl,textarea.inl{border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:8px;width:100%;line-height:1.7;min-height:0;resize:none}
.in.inl:hover,textarea.inl:hover{border-color:var(--line)}
.in.inl:focus,textarea.inl:focus{border-color:var(--acc);background:var(--card)}
.goal .in.inl{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.phead .namein{border-bottom:1.5px dashed var(--line)}
.phead .namein:focus{border-bottom-color:var(--acc)}
.file .rt .in.inl{padding:1px 4px;font-weight:600}

/* band: ornament + resume card */
.band{display:flex;align-items:flex-start;gap:10px}
.band .bmot{display:none}
.bmand{position:absolute;left:-70px;top:-80px;width:250px;aspect-ratio:1;opacity:.13;pointer-events:none;background-position:center;background-size:contain;background-repeat:no-repeat}
.band-main{position:relative;flex:1;min-width:0}
.cont{position:relative;flex:none;width:min(150px,40%);display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;text-align:start}
.cont small{font-size:10.5px;opacity:.85}
.cont-r{display:flex;align-items:center;gap:5px;max-width:100%}
.cont-r b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont-r svg{width:15px;height:15px;flex:none}
.cont-t{opacity:.7}
.cont:active{transform:scale(.97)}
/* ideas */

/* ---------- cloud (private per user) ---------- */
const C={cols:{},prof:null,t:{},writing:new Set(),dirty:new Set(),again:new Set(),first:{},setT:null,setDirty:false};
async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  let db,user; try{ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); }catch(e){ return; }
  if(!db||!user) return;
  let uid=null; try{ uid=await user.id(); }catch(e){} if(!uid) return;
  try{ const nm=await user.name(); if(nm){ S.suggestName=nm; if(S.view==='home'&&!S.settings.name) softRender(); } }catch(e){}
  try{ C.prof=db.doc('data/users/'+uid+'/profile'); KINDS.forEach(k=>{ C.cols[k]=C.prof.collection(k); }); C.blobs=C.prof.collection('blobs'); }
  catch(e){ C.prof=null; C.cols={}; return; }
  S.mode='cloud'; setStatus();
  C.prof.onSnapshot(s=>{
    if(!s.exists||C.setDirty) return; const d=s.data()||{}; if(!d.settings) return;
    const next={...S.settings,...clone(d.settings)}; if(same(next,S.settings)) return;
    S.settings=next; saveLocal(); applyLook(); softRender();
  },()=>{});
  KINDS.forEach(k=>C.cols[k].onSnapshot(snap=>onSnap(k,snap),()=>fallbackLocal()));
}
function onSnap(k,snap){
  if(!C.first[k]){
    if(snap.metadata&&snap.metadata.fromCache&&snap.empty) return;
    C.first[k]=true;
    if(snap.empty&&S[k].length){ S[k].forEach(x=>queueSave(x.id,k)); return; }
  }
  const busy=id=>C.dirty.has(k+':'+id)||C.writing.has(k+':'+id);
  const inc=new Map(snap.docs.map(d=>[d.id,d.data()]));
  let changed=false; const next=[];
  for(const [id,data] of inc){
    const local=S[k].find(x=>x.id===id);
    if(local&&busy(id)){ next.push(local); continue; }
    if(local&&same(local,data)){ next.push(local); continue; }
    changed=true; next.push(clone(data));
  }
  for(const x of S[k]){ if(!inc.has(x.id)){ if(busy(x.id)) next.push(x); else changed=true; } }
  if(!changed) return;
  next.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  S[k]=next; if(k==='halaqat') migrate(); saveLocal(); softRender();
}
function fallbackLocal(){ C.cols={}; C.prof=null; C.blobs=null; S.mode='local'; setStatus(); }
function queueSave(id,k='plans'){ if(!C.cols[k]) return; const key=k+':'+id; C.dirty.add(key); clearTimeout(C.t[key]); C.t[key]=setTimeout(()=>flush(key),800); setStatus(); }
function removeRemote(k,id){ if(!C.cols[k]) return; const key=k+':'+id; C.dirty.add(key); flush(key); }
async function flush(key){
  const i=key.indexOf(':'), k=key.slice(0,i), id=key.slice(i+1); const col=C.cols[k]; if(!col) return;
  if(C.writing.has(key)){ C.again.add(key); return; }
  C.dirty.delete(key); C.writing.add(key); setStatus();
  const x=S[k].find(o=>o.id===id);
  try{ if(x) await col.doc(id).set(clone(x)); else await col.doc(id).delete(); }
  catch(e){ const code=e&&e.code;
    if(code==='quota_exceeded') toast('امتلأت مساحة الحفظ؛ احذف عناصر قديمة');
    else if(code==='unavailable'){ C.writing.delete(key); setTimeout(()=>queueSave(id,k),1500+Math.random()*1500); return; }
    else if(code==='invalid_argument'&&x&&JSON.stringify(x).length>250000) toast('هذا العنصر كبير جدًّا للحفظ؛ قلّل الصور أو النصوص فيه');
    else { toast('تعذّر الحفظ في حسابك؛ سيُحفظ عملك على هذا الجهاز'); C.writing.delete(key); fallbackLocal(); return; } }
  C.writing.delete(key); if(C.again.has(key)){ C.again.delete(key); flush(key); } setStatus();
}
function saveSettings(){ saveLocal(); if(!C.prof) return; C.setDirty=true; clearTimeout(C.setT);
  C.setT=setTimeout(async()=>{ try{ await C.prof.set({settings:clone(S.settings)}); }catch(e){} C.setDirty=false; },800); }
function setStatus(){ const el=$('#sync'); if(!el) return; let cls='',txt='محفوظ على هذا الجهاز فقط';
  if(S.mode==='cloud'){ const b=C.dirty.size||C.writing.size; cls=b?'busy':'ok'; txt=b?'جارٍ الحفظ…':'محفوظ في حسابك'; }

const CH=180000;
const idb=()=>new Promise((ok,no)=>{ const r=indexedDB.open('basira-files',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); });
async function idbOp(mode,fn){ const db=await idb(); return new Promise((ok,no)=>{ const tx=db.transaction('f',mode); const st=tx.objectStore('f'); const r=fn(st); tx.oncomplete=()=>ok(r&&r.result); tx.onerror=()=>no(tx.error); }); }
const toB64=file=>new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=no; r.readAsDataURL(file); });
async function blobPut(file,onp){
  const id=nid()+nid(); const b64=await toB64(file); const parts=Math.max(1,Math.ceil(b64.length/CH));
  if(C.blobs){ for(let i=0;i<parts;i++){ await C.blobs.doc(id+'-'+i).set({d:b64.slice(i*CH,(i+1)*CH)}); onp&&onp((i+1)/parts); } return {id,parts,local:false}; }
  await idbOp('readwrite',st=>st.put(b64,id)); return {id,parts,local:true};
}
async function blobGet(f){
  if(!f.local){ if(!C.blobs) throw {code:'offline'}; let s=''; for(let i=0;i<f.parts;i++){ const d=await C.blobs.doc(f.bid+'-'+i).get(); if(!d.exists) throw {code:'missing'}; s+=d.data().d; } return s; }
  const s=await idbOp('readonly',st=>st.get(f.bid)); if(!s) throw {code:'missing'}; return s;
}
async function blobDel(f){ try{ if(!f.local&&C.blobs){ for(let i=0;i<f.parts;i++) await C.blobs.doc(f.bid+'-'+i).delete(); } else await idbOp('readwrite',st=>st.delete(f.bid)); }catch(e){} }
const b64ToBlob=(s,type)=>{ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:type||'application/octet-stream'}); };

function sparkLevel(pp){
  const pts=(pp.journal||[]).filter(j=>j.level).sort((a,b)=>a.date.localeCompare(b.date)); if(pts.length<2) return '';
  const W=340,H=120,L=14,R=74,T=12,B=26; const d0=pdate(pts[0].date).getTime(), d1=pdate(pts[pts.length-1].date).getTime();
  const x=t=>(W-R)-(d1===d0?0.5:(pdate(t).getTime()-d0)/(d1-d0))*(W-R-L); const y=v=>T+(5-v)/4*(H-T-B);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(p.date).toFixed(1)},${y(p.level).toFixed(1)}`).join(' '); const last=pts[pts.length-1];
  return `<div class="blk">${blkH('compass','قربه من الالتزام عبر الوقت')}
  <svg class="lvchart" viewBox="0 0 ${W} ${H}" style="direction:ltr" role="img" aria-label="من ${NEAR[pts[0].level-1]} إلى ${NEAR[last.level-1]}">
    ${[1,2,3,4,5].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v%2?'':'stroke-dasharray="2 4"'}/>${v%2?`<text x="${W-R+8}" y="${y(v)+4}" font-size="11" fill="var(--muted)">${NEAR[v-1]}</text>`:''}`).join('')}
    <path d="${path} L${x(last.date).toFixed(1)},${H-B} L${x(pts[0].date).toFixed(1)},${H-B} Z" fill="var(--acc)" opacity=".1"/>
    <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.level).toFixed(1)}" r="${i===pts.length-1?5.5:4.5}" fill="var(--acc)" stroke="var(--card)" stroke-width="2"><title>${fd(p.date)}: ${NEAR[p.level-1]}</title></circle>`).join('')}
    <text x="${W-R}" y="${H-7}" font-size="11" text-anchor="end" fill="var(--muted)">${fd(pts[0].date)}</text><text x="${L}" y="${H-7}" font-size="11" fill="var(--muted)">${fd(last.date)}</text></svg></div>`;
}

/* ================= halaqat ================= */
function newHalaqa(){ return {id:nid(),name:'',type:'tarbawi',place:'',days:[],time:'',freq:'w',goal:'',members:[],mid:'',progress:{},agenda:AGTPL.tarbawi.map(([a,mm])=>({id:nid(),name:a,min:mm})),sessions:[],createdAt:Date.now(),updatedAt:Date.now()}; }
function migrate(){
  S.halaqat.forEach(h=>{ if(h.manhaj&&Array.isArray(h.manhaj.units)&&!h.mid){
    if(h.manhaj.units.length){ const T=MANAHIJ.find(x=>x.k===h.manhaj.tpl); const m=newManhaj(T?T.name:'منهج '+(h.name||'الحلقة'));
      m.subjects[0].units=h.manhaj.units.map(u=>({id:u.id,name:u.name,note:''})); S.manahij.unshift(m); touch(m); h.mid=m.id;
      h.progress={}; h.manhaj.units.forEach(u=>{ if(u.done) h.progress[u.id]=true; }); }
    delete h.manhaj; touch(h); } });
}
const fmtTime=t=>{ if(!t) return ''; const [h,m]=t.split(':').map(Number); const hh=((h+11)%12)+1; return n(hh+':'+String(m).padStart(2,'0'))+' '+(h<12?'ص':'م'); };
function nextSession(h){ if(!(h.days||[]).length) return null; const last=(h.sessions||[]).map(x=>x.date).sort().pop(); const t0=new Date();
  for(let i=0;i<70;i++){ const d=new Date(t0); d.setDate(t0.getDate()+i); if(!h.days.includes(String(d.getDay()))) continue; const sd=iso(d);
    if(h.freq!=='w'&&last&&dayDiff(last,sd)<(h.freq==='2w'?12:26)) continue; return sd; } return null; }
const whenTxt=sd=>{ if(!sd) return ''; const dd=dayDiff(today(),sd); return dd===0?'اليوم':dd===1?'غدًا':(DAYS.find(x=>x.k===String(pdate(sd).getDay()))?.name||'')+' '+fd(sd); };

function hStats(h){ const ss=h.sessions||[]; const units=mUnits(hMan(h)); const mem=h.members||[]; const done=units.filter(u=>h.progress?.[u.id]).length;
  const att=ss.length&&mem.length?Math.round(100*ss.reduce((a,s)=>a+(s.present||[]).filter(x=>mem.includes(x)).length,0)/(ss.length*mem.length)):null;
  return {ss:ss.length,mem:mem.length,att,done,units:units.length,pct:units.length?Math.round(100*done/units.length):0}; }
const memRate=(h,pid)=>{ const ss=h.sessions||[]; return ss.length?Math.round(100*ss.filter(s=>(s.present||[]).includes(pid)).length/ss.length):null; };

function hInsights(h){ const out=[]; const ss=[...(h.sessions||[])].sort((a,b)=>b.date.localeCompare(a.date)); const mem=h.members||[];

  if(mem.length>15) out.push(['warn','العدد كبير؛ فكّر في تقسيمها إلى حلقتين.']);
  if(!hMan(h)) out.push(['warn','اختر منهجًا ليعرف الجميع أين وصلوا.']);
  if(ss.length>=2) mem.forEach(pid=>{ if(!(ss[0].present||[]).includes(pid)&&!(ss[1].present||[]).includes(pid)) out.push(['warn',`غاب ${pname(pid)} عن آخر لقاءين؛ تواصل معه بلطف.`,pid]); });

/* ================= exports ================= */
async function exportDoc(html,cutSel,filename,btn,bg='#ffffff'){
  if(window.__busyPDF) return; window.__busyPDF=true; const old=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.innerHTML=ic('download')+'جارٍ التجهيز…'; }
  let wrap;
  try{
    const dl=await getDownloads(); if(!dl){ toast('التنزيل غير متاح هنا'); return; }
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    try{ await document.fonts.ready; }catch(_){}
    wrap=document.createElement('div'); wrap.className='pdfwrap'; wrap.innerHTML=html; document.body.appendChild(wrap);
    await new Promise(r=>setTimeout(r,160));
    const W=wrap.offsetWidth, top0=wrap.getBoundingClientRect().top; const pageH=Math.round(W*297/210), MT=28, MB=40, avail=pageH-MT-MB;
    const boxes=[...wrap.querySelectorAll(cutSel)].map(e=>{ const r=e.getBoundingClientRect(); return {t:Math.round(r.top-top0),b:Math.round(r.bottom-top0),after:!!(e.previousElementSibling&&e.previousElementSibling.classList.contains('pd-sh'))}; });
    const ok=y=>!boxes.some(x=>x.t<y-2&&x.b>y+2);
    const cuts=[...new Set(boxes.filter(x=>!x.after).map(x=>x.t-8))].filter(v=>v>0&&ok(v)).sort((a,b)=>a-b);
    const total=wrap.scrollHeight; const pages=[]; let y=0;
    while(y<total-6){ let end=Math.min(y+avail,total); if(end<total){ const c=cuts.filter(v=>v>y+avail*0.3&&v<=y+avail).pop(); if(c) end=c; } pages.push([y,end]); y=end; }
    const canvas=await window.html2canvas(wrap,{scale:2,backgroundColor:bg,useCORS:true,logging:false,windowWidth:W,scrollX:0,scrollY:-window.scrollY});
    const k=canvas.width/W; const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'}); const [r,g,b]=hx(PAL().acc);
    pages.forEach(([a,bb],i)=>{ const c=document.createElement('canvas'); c.width=canvas.width; c.height=Math.round(pageH*k); const gx=c.getContext('2d'); gx.fillStyle=bg; gx.fillRect(0,0,c.width,c.height);
      gx.drawImage(canvas,0,Math.round(a*k),canvas.width,Math.round((bb-a)*k),0,Math.round(MT*k),canvas.width,Math.round((bb-a)*k));
      if(i) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
      pdf.setFillColor(r,g,b); pdf.rect(0,0,210,2,'F'); pdf.setFontSize(9); pdf.setTextColor(140,140,140); pdf.text((i+1)+' / '+pages.length,105,289,{align:'center'}); });
    await dl.save({filename,data:pdf.output('arraybuffer')}); toast('نُزّل ملف PDF');
  }catch(e){ if(!(e&&e.code==='declined')) toast(e&&e.code==='extension_not_enabled'?'تنزيل PDF غير متاح هنا':'تعذّر إنشاء PDF؛ حاول مرة أخرى'); }
  finally{ if(wrap) wrap.remove(); window.__busyPDF=false; if(btn){ btn.disabled=false; btn.innerHTML=old; } }
}

    case 'cprev': cardMove(-1,p); return;

    case 'ptype': S.ptype=arg; render(); $('#new-pt')?.focus(); return;
    case 'ptdel': p.points=(p.points||[]).filter(x=>x.id!==arg); touch(p); break;
    case 'gstat': { const g=p.goals.find(x=>x.id===arg); g.status=((g.status||0)+1)%3; touch(p); break; }
    case 'gdel': p.goals=(p.goals||[]).filter(x=>x.id!==arg); touch(p); break;
    case 'gaddlib': { const L=libOf(b.dataset.kind,arg); (p.goals=p.goals||[]).push({id:nid(),text:b.dataset.kind==='munkar'?'ترك '+L.name:L.name,lib:arg,kind:b.dataset.kind,status:0}); touch(p); break; }
    case 'pstep': { const st=p.steps.find(x=>x.id===arg); st.done=!st.done; touch(p); break; }
    case 'pstepdel': p.steps=p.steps.filter(x=>x.id!==arg); touch(p); break;
    case 'jtype': S.jtype=arg; break;
    case 'jresp': S.jresp=arg; break;
    case 'jlevel': S.jlevel=S.jlevel===+arg?0:+arg; break;
    case 'jdel': p.journal=p.journal.filter(x=>x.id!==arg); touch(p); break;
    case 'viewperson': S.viewer='person:'+p.id; break;
    case 'closeviewer': S.viewer=null; break;
    case 'pdfperson': { const pp=curPerson(); if(pp) exportPersonPDF(pp,b); rr=false; break; }
    /* halaqat */
    case 'delhalaqa': if(!armConfirm('halaqa')) break; S.halaqat=S.halaqat.filter(x=>x.id!==p.id); saveLocal(); removeRemote('halaqat',p.id); go('halaqat'); toast('حُذفت الحلقة'); return;
    case 'htab': S.htab=arg; break;
    case 'htype': { const same0=(p.agenda||[]).map(x=>x.name+x.min).join()===(AGTPL[p.type]||[]).map(x=>x[0]+x[1]).join(); p.type=arg; if(same0||!(p.agenda||[]).length) p.agenda=AGTPL[arg].map(([x,m])=>({id:nid(),name:x,min:m})); touch(p); break; }
    case 'hmember': { p.members=p.members||[]; const i=p.members.indexOf(arg); i>=0?p.members.splice(i,1):p.members.push(arg); S.sesPresent=null; touch(p); break; }
    case 'hsetman': p.mid=arg; p.progress=p.progress||{}; touch(p); break;
    case 'hsettpl': { const m=manhajFromTpl(arg); p.mid=m.id; p.progress={}; touch(p); toast('نُسخ القالب إلى مناهجك'); break; }
    case 'hunit': { p.progress=p.progress||{}; if(p.progress[arg]) delete p.progress[arg]; else p.progress[arg]=true; touch(p); break; }
    case 'agadd': p.agenda.push({id:nid(),name:'فقرة جديدة',min:10}); touch(p); break;
    case 'agdel': p.agenda=p.agenda.filter(x=>x.id!==arg); touch(p); break;
    case 'agmove': { const i=p.agenda.findIndex(x=>x.id===arg), j=i+(+b.dataset.dir); if(j>=0&&j<p.agenda.length){ [p.agenda[i],p.agenda[j]]=[p.agenda[j],p.agenda[i]]; touch(p); } break; }
    case 'agtpl': if(!armConfirm('agtpl')) break; p.agenda=AGTPL[p.type].map(([x,m])=>({id:nid(),name:x,min:m})); touch(p); break;
    case 'sespres': S.sesPresent.has(arg)?S.sesPresent.delete(arg):S.sesPresent.add(arg); b.classList.toggle('on'); rr=false; break;
    case 'sesrate': S.sesRating=S.sesRating===+arg?0:+arg; [...b.parentElement.children].forEach((x,i)=>x.classList.toggle('on',i<S.sesRating)); rr=false; break;
    case 'sesdel': p.sessions=p.sessions.filter(x=>x.id!==arg); touch(p); break;
    /* manahij */
    case 'delmanhaj': if(!armConfirm('manhaj')) break; (p.files||[]).forEach(blobDel); S.manahij=S.manahij.filter(x=>x.id!==p.id); S.halaqat.forEach(h=>{ if(h.mid===p.id){ h.mid=''; touch(h); } }); saveLocal(); removeRemote('manahij',p.id); go('manahij'); toast('حُذف المنهج'); return;
    case 'subjadd': { const s={id:nid(),name:'مادة '+n((p.subjects||[]).length+1),units:[]}; (p.subjects=p.subjects||[]).push(s); S.open.add(s.id); touch(p); break; }
    case 'subjdel': if(!armConfirm('s'+arg)) break; p.subjects=p.subjects.filter(x=>x.id!==arg); touch(p); break;
    case 'subjmove': { const i=p.subjects.findIndex(x=>x.id===arg); if(i>0){ [p.subjects[i-1],p.subjects[i]]=[p.subjects[i],p.subjects[i-1]]; touch(p); } break; }
    case 'umove': { const [sid,uid]=arg.split('|'); const s=p.subjects.find(x=>x.id===sid); const i=s.units.findIndex(x=>x.id===uid); if(i>0){ [s.units[i-1],s.units[i]]=[s.units[i],s.units[i-1]]; touch(p); } break; }
    case 'udel': { const [sid,uid]=arg.split('|'); const s=p.subjects.find(x=>x.id===sid); s.units=s.units.filter(x=>x.id!==uid); touch(p); break; }
    case 'openfile': { openSheet('file:'+arg); const f=findFile(arg); if(!f) return;
      const box=()=>$('#fprev'); if(/^image\//.test(mimeOf(f))){ try{ const s=await blobGet(f); const u=URL.createObjectURL(b64ToBlob(s,mimeOf(f))); if(box()) box().innerHTML=`<img src="${u}" alt="${esc(f.name)}" style="max-width:100%;border-radius:12px">`; }catch(err){ if(box()) box().textContent='تعذّر تحميل الملف.'; } }
      else if(box()) box().innerHTML=`${ic('doc')} ${esc(f.name)} · ${fsize(f.size)}<br>اضغط «تنزيل» لفتحه على جهازك.`; return; }
    case 'filedl': { const f=findFile(arg); if(!f) return; const dl=await getDownloads(); if(!dl){ toast('التنزيل غير متاح هنا'); return; }
      try{ b.disabled=true; const s=await blobGet(f); await dl.save({filename:f.name,data:b64ToBlob(s,mimeOf(f))}); }catch(err){ if(!(err&&err.code==='declined')) toast(err&&err.code==='rejected_extension'?'هذا النوع من الملفات لا يمكن تنزيله من هنا':err&&err.code==='offline'?'الملف محفوظ في حسابك؛ افتح الأداة متصلًا':'تعذّر تنزيل الملف'); } finally{ b.disabled=false; } return; }
    case 'filedel': { if(!armConfirm('f'+arg)) break; const f=p.files.find(x=>x.id===arg); if(f) blobDel(f); p.files=p.files.filter(x=>x.id!==arg); touch(p); toast('حُذف الملف'); break; }
    /* library & zad */
    case 'libtab': S.libTab=arg; break;
    case 'zadnext': S.zadIdx++; break;
    case 'ztype': S.ztype=arg; rr=false; { const t=$('#z-text')?.value, r=$('#z-ref')?.value; renderSheet(); if($('#z-text')) $('#z-text').value=t||''; if($('#z-ref')) $('#z-ref').value=r||''; } break;
    case 'mytdel': S.settings.myTexts=(S.settings.myTexts||[]).filter(x=>x.id!==arg); saveSettings(); break;
    case 'copyt': { const [k,v]=arg.split(':'); const t=k==='m'?(S.settings.myTexts||[]).find(x=>x.id===v):TEXTS[+v]; if(t) copy(t.t==='q'?'﴿'+t.text+'﴾ ['+t.ref+']':'«'+t.text+'» '+(t.ref||'')); rr=false; break; }
    case 'reltipreset': if(S.settings.reltips) delete S.settings.reltips[arg]; saveSettings(); break;
    /* settings */
    case 'backup': backup(); rr=false; break;
    case 'skin': S.settings.skin=arg; S.settings.skinSet=true; applyLook(); saveSettings(); break;
    case 'pal': S.settings.palette=arg; applyLook(); saveSettings(); break;
    case 'tfont': S.settings.tfont=arg; applyLook(); saveSettings(); break;
    case 'bfont': S.settings.bfont=arg; applyLook(); saveSettings(); break;
    case 'introtog': S.settings.intro=S.settings.intro===false; saveSettings(); break;
    case 'agdel': S.settings.ageGroups=(S.settings.ageGroups||[]).filter(x=>x!==arg); saveSettings(); break;
    case 'ctdel': S.settings.customTraits=(S.settings.customTraits||[]).filter(x=>x!==arg); saveSettings(); break;
    case 'logoreset': S.settings.logo=''; saveSettings(); break;
    default: rr=false;
  }
  if(rr) render(); else if(b.dataset.close) renderSheet();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(S.sheet){ closeSheet(); } else if(S.viewer){ S.viewer=null; render(); } }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
let setTimer;
document.addEventListener('input',e=>{ const el=e.target;
  if(el.dataset.bind){ const o=curObj(); if(!o) return; setPath(o,el.dataset.bind,el.type==='number'?(+el.value||0):el.value); unskipCur(o); touch(o); return; }
  if(el.dataset.set){ S.settings[el.dataset.set]=el.value.trim(); clearTimeout(setTimer); setTimer=setTimeout(()=>{ saveSettings(); renderChrome(); },300); return; }
  if(el.dataset.reltip){ S.settings.reltips=S.settings.reltips||{}; S.settings.reltips[el.dataset.reltip]=el.value; clearTimeout(setTimer); setTimer=setTimeout(saveSettings,400); return; }
  if(el.id==='j-text'){ S.jdraft=el.value; return; } if(el.id==='j-date'){ S.jdate=el.value; return; } if(el.id==='s-notes'){ S.sesNotes=el.value; return; }
  const live=(key,id,setter)=>{ setter(el.value); const pos=el.selectionStart; key==='sheet'?renderSheet():render(); const ni=document.getElementById(id); if(ni){ ni.focus(); try{ ni.setSelectionRange(pos,pos); }catch(_){} } };
  if(el.dataset.sq){ live('sheet','sh-q',v=>S.sq=v); return; }
  if(el.dataset.pq){ live('view','pq',v=>S.pq=v); return; }
  if(el.dataset.q){ live('view','lib-q',v=>S.q=v); return; }
});
document.addEventListener('change',async e=>{ const el=e.target;
  if(el.dataset.bind==='ageN'){ const p=curPerson(); if(p&&p.ageN&&(!p.age||AGESP.some(o=>o.k===p.age))){ p.age=ageFromN(p.ageN); touch(p); } }
  if(el.dataset.bind&&(['date','number','time'].includes(el.type)||el.tagName==='SELECT')){ render(); return; }
  const file=el.files&&el.files[0]; if(!file) return;
  if(el.id==='imp'){ importFile(file); }
  else if(el.id==='ph-file'){ try{ const pp=curPerson(); pp.photo=await resizeImage(file,320); touch(pp); render(); }catch(err){ toast('تعذّر قراءة الصورة'); } }
  else if(el.id==='logo-file'){ try{ S.settings.logo=await resizeImage(file,420,'image/png'); saveSettings(); render(); toast('تغيّر الشعار'); }catch(err){ toast('تعذّر قراءة الصورة'); } }
  else if(el.id==='mf-file'){ const m=curManhaj(); const files=[...el.files]; el.value='';
    for(const f of files){ if(f.size>10*1048576){ toast('«'+f.name+'» أكبر من ١٠ م.ب'); continue; }
      try{ toast('جارٍ رفع «'+f.name+'»…'); const r=await blobPut(f,pr=>{ if(pr<1) toast('جارٍ رفع «'+f.name+'» '+n(Math.round(pr*100))+'٪'); });
        (m.files=m.files||[]).push({id:nid(),bid:r.id,parts:r.parts,local:r.local,name:f.name,size:f.size,type:f.type||''}); touch(m); render(); toast('رُفع «'+f.name+'»'); }
      catch(err){ toast('تعذّر رفع «'+f.name+'»'); } } }
});
document.addEventListener('submit',e=>{ const f=e.target; if(!f.dataset.form) return; e.preventDefault(); const p=curObj();
  const val=sel=>{ const x=f.querySelector(sel); return x?x.value.trim():''; };
  switch(f.dataset.form){
    case 'name': { const v=val('#hero-name'); if(!v) return; S.settings.name=v; saveSettings(); render(); toast('حُفظ الاسم'); return; }
    case 'newperson': { const v=val('#np-name'); if(!v) return; const pp=newPerson(v); S.people.unshift(pp); touch(pp); go('person',{personId:pp.id,ptab:'file',jdraft:''}); return; }
    case 'point': { const v=val('#new-pt'); if(!v) return; (p.points=p.points||[]).push({id:nid(),type:S.ptype,text:v}); touch(p); render(); $('#new-pt')?.focus(); return; }
    case 'pstep': { const v=val('#new-pstep'); if(!v) return; (p.steps=p.steps||[]).push({id:nid(),text:v,date:'',done:false}); touch(p); render(); $('#new-pstep')?.focus(); return; }
    case 'journal': { const v=(S.jdraft||'').trim(); if(!v&&!S.jlevel){ $('#j-text').focus(); toast('اكتب ماذا حدث'); return; }
      (p.journal=p.journal||[]).push({id:nid(),date:$('#j-date').value||today(),ts:Date.now(),type:S.jtype,text:v,resp:S.jresp,level:S.jlevel||0});
      if(S.jlevel) p.level=S.jlevel; S.jdraft=''; S.jlevel=0; S.jdate=''; touch(p); render(); toast('سُجّل في يومياته'); return; }
    case 'session': { const date=$('#s-date').value||today(); const unit=$('#s-unit')?.value||''; const present=[...(S.sesPresent||[])];
      (p.sessions=p.sessions||[]).push({id:nid(),date,unit,present,notes:(S.sesNotes||'').trim(),rating:S.sesRating||0});
      if(unit&&$('#s-done')?.checked){ p.progress=p.progress||{}; p.progress[unit]=true; }
      const un=mUnits(hMan(p)).find(x=>x.id===unit);
      present.forEach(pid=>{ const pp=S.people.find(x=>x.id===pid); if(!pp) return; (pp.journal=pp.journal||[]).push({id:nid(),date,ts:Date.now(),type:'halaqa',text:'حضر «'+(p.name||'الحلقة')+'»'+(un?' — '+un.name:''),resp:'',level:0}); touch(pp); });
      S.sesPresent=null; S.sesNotes=''; S.sesRating=0; touch(p); render(); toast('سُجّل اللقاء'); return; }
    case 'unitadd2': { const sid=f.dataset.subj; const inp=f.querySelector('input'); const v=inp.value.trim(); if(!v) return; const s=p.subjects.find(x=>x.id===sid); s.units.push({id:nid(),name:v,note:''}); touch(p); render(); document.getElementById('nu-'+sid)?.focus(); return; }
    case 'zad': { const t=val('#z-text'); if(!t){ $('#z-text').focus(); return; } const rec={t:S.ztype==='q'?'q':'h',kind:S.ztype,text:t.replace(/^[﴿«"]+|[﴾»"]+$/g,''),ref:val('#z-ref'),th:val('#z-th')||'fadl'}; const arr=S.settings.myTexts=S.settings.myTexts||[]; const ei=f.dataset.id?arr.findIndex(x=>x.id===f.dataset.id):-1; if(ei>=0) arr[ei]={...arr[ei],...rec}; else arr.unshift({id:nid(),...rec});
      saveSettings(); S.sheet=null; { const L=allTexts().length; S.zadIdx=(L-dayIdx()%L)%L; } render(); toast('أُضيف إلى زاد الداعية'); return; }
    case 'pkcustom': { const P=PK[f.dataset.pk]; const v=val('#pk-custom'); if(!P||!P.custom||!v) return; P.custom.add(v); render(); $('#pk-custom')?.focus(); return; }
  }
});
window.addEventListener('resize',()=>{ if(S.view==='plan') fitPlan(); });

/* ================= intro & boot ================= */
function intro(){
  const el=$('#intro'); let seen=false; try{ seen=sessionStorage.getItem('basira.intro')==='1'; sessionStorage.setItem('basira.intro','1'); }catch(e){}
  if(S.settings.intro===false||seen){ el.remove(); return; }
  el.querySelector('.in-dome').src=DOME;
  el.querySelector('.in-logo-w').innerHTML=S.settings.logo?`<img class="in-logo" src="${esc(S.settings.logo)}" alt="الشعار">`:'<span class="in-logo lmask" role="img" aria-label="الدعوة"></span>';
  el.hidden=false; let done=false; const out=()=>{ if(done) return; done=true; el.classList.add('out'); setTimeout(()=>el.remove(),520); };
  el.addEventListener('click',out); setTimeout(out,2700);
}
loadLocal(); try{ S.last=JSON.parse(localStorage.getItem('basira.last')||'null'); }catch(e){} applyLook(); migrate(); intro(); render(); initCloud();

</script>
